[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-insight"
version = "1.0.0"
description = "Nginx 日志采集与省份访问监控"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<4", "SQLAlchemy>=2.0,<3", "PyMySQL[rsa]>=1.1,<2", "redis>=5,<7", "requests>=2.32,<3", "python-dotenv>=1,<2", "gunicorn>=23,<24"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
nginx-insight = "insight.cli:main"

[tool.setuptools.package-data]
insight = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
