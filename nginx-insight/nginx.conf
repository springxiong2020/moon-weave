http {

    # =====================================================
    # 日志格式
    # =====================================================

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" '
        '"$http_user_agent" '
        'rt=$request_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=3s;
    # error_log 使用 Nginx 固定文本格式，不能通过 log_format 自定义：
    # YYYY/MM/DD HH:MM:SS [level] pid#tid: *connection message, client: IP, ...
    # *connection 和 client 等上下文字段可能缺省；时间为 Nginx 本地时间。
    error_log  /var/log/nginx/error.log warn;

    # =====================================================
    # 加载站点配置
    # =====================================================

    include /etc/nginx/sites-enabled/*;

}